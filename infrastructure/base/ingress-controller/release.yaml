apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: ingress-controller
spec:
  interval: 10m
  chart:
    spec:
      chart: nginx-ingress
      version: '1.3.2'
      sourceRef:
        kind: HelmRepository
        name: nginx-ingress
        namespace: ingress-controller
      interval: 10m
  releaseName: nginx-ingress
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      service:
        type: LoadBalancer
        annotations:
          metallb.universe.tf/address-pool: default
